[project]
name = "sqlalchemy-audit-trail"
version = "0.1.0a1"
description = "Audit trail for SQLAlchemy on PostgreSQL: entity change diffs and domain events in one partitioned log"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4.0"
authors = [{ name = "WiktorB2004" }]
keywords = [
    "sqlalchemy",
    "audit",
    "audit-log",
    "audit-trail",
    "postgresql",
    "history",
    "gdpr",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "sqlalchemy>=2.0,<2.2",
]

[project.optional-dependencies]
pydantic = ["pydantic>=2"]
fastapi = ["fastapi>=0.110"]
psycopg = ["psycopg[binary]>=3.1"]
asyncio = ["sqlalchemy[asyncio]>=2.0,<2.2"]
asyncpg = ["asyncpg>=0.29", "sqlalchemy[asyncio]>=2.0,<2.2"]

[project.urls]
Homepage = "https://github.com/WiktorB2004/sqlalchemy-audit-trail"
Repository = "https://github.com/WiktorB2004/sqlalchemy-audit-trail"
Issues = "https://github.com/WiktorB2004/sqlalchemy-audit-trail/issues"
Documentation = "https://wiktorb2004.github.io/sqlalchemy-audit-trail/"
Changelog = "https://github.com/WiktorB2004/sqlalchemy-audit-trail/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "asyncpg>=0.29",
    "fastapi>=0.110",
    "httpx>=0.27",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2",
    "pytest",
    "pytest-asyncio",
    "ruff==0.16.8",
    "sqlalchemy[asyncio]",
    "testcontainers[postgres]>=4.8",
]
docs = [
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["audit_trail/", "LICENSE", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["audit_trail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: needs a PostgreSQL server (AUDIT_TEST_DATABASE_URL or Docker for testcontainers)",
]

[tool.mypy]
python_version = "3.10"
files = ["audit_trail", "tests"]
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["testcontainers", "testcontainers.*"]
ignore_missing_imports = true
