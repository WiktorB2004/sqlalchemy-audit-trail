name: Feature request
description: A change to this library (not SQLAlchemy or PostgreSQL)
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for **sqlalchemy-audit-trail** only. SQLAlchemy, PostgreSQL, driver and FastAPI requests belong upstream.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - flush listener / entity changes
        - explicit events (log / alog)
        - query API (audit.query)
        - partitions / maintenance / migrations
        - privacy (pseudonyms, redaction, scrub)
        - FastAPI integration
        - testing helpers / pytest plugin
        - docs / other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change in this library?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What did you consider instead?
