site_name: sqlalchemy-audit-trail
site_description: Audit trail for SQLAlchemy on PostgreSQL
site_url: https://wiktorb2004.github.io/sqlalchemy-audit-trail/
repo_url: https://github.com/WiktorB2004/sqlalchemy-audit-trail
repo_name: WiktorB2004/sqlalchemy-audit-trail
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 WiktorB2004 — MIT

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Guides:
      - Audited models: guides/models.md
      - Domain events: guides/events.md
      - Request context: guides/context.md
      - FastAPI: guides/fastapi.md
      - Querying the log: guides/querying.md
      - Privacy and GDPR: guides/privacy.md
      - Partitions and retention: guides/partitions.md
      - Testing your application: guides/testing.md
  - Limitations: limitations.md
  - API:
      - audit_trail.config: api/config.md
      - audit_trail.events: api/events.md
      - audit_trail.context: api/context.md
      - audit_trail.tables: api/tables.md
      - audit_trail.query: api/query.md
      - audit_trail.maintenance: api/maintenance.md
      - audit_trail.privacy: api/privacy.md
      - audit_trail.checks: api/checks.md
      - audit_trail.testing: api/testing.md
  - Development: development.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            members_order: source
            merge_init_into_class: true
            show_root_heading: false
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: false
            inherited_members: false
            show_bases: true
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

watch:
  - audit_trail
  - README.md
  - CHANGELOG.md

validation:
  omitted_files: warn
  absolute_links: relative_to_docs
  unrecognized_links: warn
  anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/WiktorB2004/sqlalchemy-audit-trail
